# pnpm blocks dependency build scripts by default. electron-winstaller is the
# only dependency in this tree that declares one; it is a Windows-only installer
# helper pulled in by electron-builder and is not needed to build here, so it
# stays blocked. Naming it explicitly is what keeps `pnpm install` from ending in
# ERR_PNPM_IGNORED_BUILDS.
#
# Electron itself needs no entry: from v44 it ships no install script at all and
# downloads its platform binary lazily, on the first `electron .`.
#
# esbuild reaches this tree twice, through Vite and through tsup. From 0.25 it
# ships its platform binary as an optional dependency and its install script is
# only a verification pass, so blocking it costs nothing: `esbuild --version`
# and `tsup` both work with it off.
#
# msw's postinstall only copies its browser service worker into a public
# directory; the tests here use msw/node (setupServer), which needs no worker.
allowBuilds:
  electron-winstaller: false
  esbuild: false
  msw: false

overrides:
  esbuild: ">=0.28.1"
