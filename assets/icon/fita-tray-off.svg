<!-- Off: no server, or one that is not answering. Dashed body, hollow reels, a slash with a clear halo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 16 96 96" width="96" height="96">
  <defs>
    <mask id="halo" maskUnits="userSpaceOnUse" x="16" y="16" width="96" height="96">
      <rect x="16" y="16" width="96" height="96" fill="#fff"/>
      <line x1="30" y1="98" x2="98" y2="30" stroke="#000" stroke-width="15" stroke-linecap="round"/>
    </mask>
  </defs>
  <g mask="url(#halo)">
    <rect x="24" y="38" width="80" height="52" rx="12" fill="none" stroke="#000" stroke-width="7" stroke-dasharray="11 8"/>
    <circle cx="50" cy="64" r="8.5" fill="none" stroke="#000" stroke-width="5"/>
    <circle cx="78" cy="64" r="8.5" fill="none" stroke="#000" stroke-width="5"/>
  </g>
  <line x1="30" y1="98" x2="98" y2="30" stroke="#000" stroke-width="7" stroke-linecap="round"/>
</svg>
