<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Fita. Browsers that read SVG favicons take the vector; the rest fall
         back to the .ico. Both are generated by `pnpm icons`. -->
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Peace Breaker Bot" />
    <title>Peace Breaker Bot</title>

    <!--
      Pre-paint guard. React mounts too late: without this every launch
      flashes the wrong ground, and on Windows the native caption buttons
      are painted before the app has an opinion about the palette.

      The preload bridge has already run by the time this parses, so the
      real platform is available synchronously. In a plain browser tab it
      is absent and the UA answer stands.
    -->
    <script>
      (function () {
        var r = document.documentElement;

        function read(key, fallback) {
          try {
            var raw = localStorage.getItem(key);
            return raw === null ? fallback : JSON.parse(raw);
          } catch (e) {
            return fallback;
          }
        }

        var bridge = window.instantsPlatform;
        var ua =
          (navigator.userAgentData && navigator.userAgentData.platform) ||
          navigator.userAgent ||
          "";
        r.dataset.os =
          (bridge && bridge.os) ||
          (/mac|iphone|ipad/i.test(ua) ? "mac" : /windows|win32|win64/i.test(ua) ? "win" : "linux");

        // Whether Electron merged the window into the OS bar. Stamped here
        // too, so the toolbar's padding is right from the first frame.
        r.dataset.chrome = bridge && bridge.chrome === "custom" ? "custom" : "native";

        // Linux only: GNOME gets the app's own header bar, the rest keep the
        // window manager's title bar. GNOME also stands in with no bridge.
        if (r.dataset.os === "linux") {
          var desktop = bridge && bridge.desktop;
          r.dataset.desktop =
            desktop === "kde" || desktop === "other" ? desktop : "gnome";
        }

        // One-shot migration. "theme" used to hold "light" | "dark"; it now
        // holds the palette, and the light/dark choice lives in "colorMode".
        // Without this an existing install boots with a palette named "dark",
        // matches no selector, and renders unstyled.
        var stored = read("theme", null);
        if (stored === "light" || stored === "dark") {
          try {
            localStorage.setItem("colorMode", JSON.stringify(stored));
            localStorage.setItem("theme", JSON.stringify("esmalte"));
          } catch (e) {}
        }

        var mode = read("colorMode", "auto");
        r.dataset.mode =
          mode === "light" || mode === "dark"
            ? mode
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";

        var themes = [
          "esmalte", "frevo", "cerrado", "brasa",
          "fliperama", "discord", "contraste", "oled"
        ];
        var theme = read("theme", "esmalte");
        r.dataset.theme = themes.indexOf(theme) === -1 ? "esmalte" : theme;

        var languages = ["pt-BR", "en-US"];
        var storedLang = read("language", null);
        var osPrimary = (navigator.language || "").split("-")[0].toLowerCase();
        var lang = languages.indexOf(storedLang) !== -1 ? storedLang : (osPrimary === "pt" ? "pt-BR" : "en-US");
        r.lang = lang;
        r.dataset.lang = lang;
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
